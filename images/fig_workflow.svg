<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3C4043"/></marker>
    <marker id="loop" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9AA0A6"/></marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">The everyday Git cycle</text>

  <!-- boxes -->
  <g>
    <rect x="30"  y="90" width="120" height="80" rx="12" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
    <text x="90"  y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1A73E8">Edit file</text>
    <text x="90"  y="144" text-anchor="middle" font-size="11" fill="#5F6368">do your work</text>

    <rect x="188" y="90" width="120" height="80" rx="12" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="2"/>
    <text x="248" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">git status</text>
    <text x="248" y="140" text-anchor="middle" font-size="11" fill="#5F6368">what's</text>
    <text x="248" y="154" text-anchor="middle" font-size="11" fill="#5F6368">happening?</text>

    <rect x="346" y="90" width="120" height="80" rx="12" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="2"/>
    <text x="406" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">git diff</text>
    <text x="406" y="140" text-anchor="middle" font-size="11" fill="#5F6368">what</text>
    <text x="406" y="154" text-anchor="middle" font-size="11" fill="#5F6368">changed?</text>

    <rect x="504" y="90" width="120" height="80" rx="12" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2"/>
    <text x="564" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#B06000">git add .</text>
    <text x="564" y="140" text-anchor="middle" font-size="11" fill="#5F6368">prepare to</text>
    <text x="564" y="154" text-anchor="middle" font-size="11" fill="#5F6368">save</text>

    <rect x="662" y="90" width="120" height="80" rx="12" fill="#E6F4EA" stroke="#188038" stroke-width="2"/>
    <text x="722" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#188038">git commit</text>
    <text x="722" y="140" text-anchor="middle" font-size="11" fill="#5F6368">save this</text>
    <text x="722" y="154" text-anchor="middle" font-size="11" fill="#5F6368">version</text>

    <rect x="800" y="90" width="90" height="80" rx="12" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="2"/>
    <text x="845" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#202124">git log</text>
    <text x="845" y="144" text-anchor="middle" font-size="11" fill="#5F6368">history</text>
  </g>

  <!-- arrows between -->
  <line x1="152" y1="130" x2="186" y2="130" stroke="#3C4043" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="310" y1="130" x2="344" y2="130" stroke="#3C4043" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="468" y1="130" x2="502" y2="130" stroke="#3C4043" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="626" y1="130" x2="660" y2="130" stroke="#3C4043" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="784" y1="130" x2="798" y2="130" stroke="#3C4043" stroke-width="2" marker-end="url(#ar3)"/>

  <!-- loop back -->
  <path d="M845,172 C845,235 300,240 90,235 L90,174" fill="none" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#loop)"/>
  <text x="450" y="258" text-anchor="middle" font-size="13" font-style="italic" fill="#5F6368">…then keep working and repeat</text>
</svg>
