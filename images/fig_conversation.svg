<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="390" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Git is a conversation with your project</text>

  <text x="180" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#5F6368">You ask…</text>
  <text x="590" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#5F6368">Git answers…</text>

  <!-- row 1 -->
  <rect x="40" y="86" width="300" height="48" rx="24" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.6"/>
  <text x="190" y="115" text-anchor="middle" font-size="14" fill="#202124">"What's happening?"</text>
  <rect x="440" y="86" width="300" height="48" rx="10" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.6"/>
  <text x="590" y="115" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="700" fill="#202124">git status</text>

  <!-- row 2 -->
  <rect x="40" y="150" width="300" height="48" rx="24" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.6"/>
  <text x="190" y="179" text-anchor="middle" font-size="14" fill="#202124">"What did I change?"</text>
  <rect x="440" y="150" width="300" height="48" rx="10" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.6"/>
  <text x="590" y="179" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="700" fill="#202124">git diff</text>

  <!-- row 3 -->
  <rect x="40" y="214" width="300" height="48" rx="24" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.6"/>
  <text x="190" y="243" text-anchor="middle" font-size="14" fill="#202124">"Save this version."</text>
  <rect x="440" y="214" width="300" height="48" rx="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.6"/>
  <text x="590" y="243" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" font-weight="700" fill="#B06000">git add  +  git commit</text>

  <!-- row 4 -->
  <rect x="40" y="278" width="300" height="48" rx="24" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.6"/>
  <text x="190" y="307" text-anchor="middle" font-size="14" fill="#202124">"What have I saved?"</text>
  <rect x="440" y="278" width="300" height="48" rx="10" fill="#E6F4EA" stroke="#188038" stroke-width="1.6"/>
  <text x="590" y="307" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="700" fill="#188038">git log</text>

  <text x="390" y="360" text-anchor="middle" font-size="13" font-style="italic" fill="#5F6368">Don't memorize commands — learn the questions, and the commands follow.</text>
</svg>
