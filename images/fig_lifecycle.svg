<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3C4043"/>
    </marker>
  </defs>

  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">The life of a file (what git status is telling you)</text>

  <!-- Untracked -->
  <rect x="40" y="120" width="180" height="70" rx="12" fill="#FCE8E6" stroke="#D93025" stroke-width="2.5"/>
  <text x="130" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#D93025">Untracked</text>
  <text x="130" y="172" text-anchor="middle" font-size="12" fill="#5F6368">Git sees it, ignores it</text>

  <!-- Staged -->
  <rect x="340" y="120" width="180" height="70" rx="12" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2.5"/>
  <text x="430" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#B06000">Staged</text>
  <text x="430" y="172" text-anchor="middle" font-size="12" fill="#5F6368">packed, ready to save</text>

  <!-- Committed -->
  <rect x="640" y="120" width="180" height="70" rx="12" fill="#E6F4EA" stroke="#188038" stroke-width="2.5"/>
  <text x="730" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#188038">Committed</text>
  <text x="730" y="172" text-anchor="middle" font-size="12" fill="#5F6368">safely in history</text>

  <!-- Modified (below) -->
  <rect x="340" y="250" width="180" height="60" rx="12" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2.5"/>
  <text x="430" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#1A73E8">Modified</text>
  <text x="430" y="298" text-anchor="middle" font-size="12" fill="#5F6368">changed since last save</text>

  <!-- untracked -> staged -->
  <line x1="222" y1="155" x2="338" y2="155" stroke="#3C4043" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#3C4043">git add</text>

  <!-- staged -> committed -->
  <line x1="522" y1="155" x2="638" y2="155" stroke="#3C4043" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="580" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#3C4043">git commit</text>

  <!-- committed -> modified (edit) -->
  <path d="M700,192 C690,235 560,270 522,278" fill="none" stroke="#3C4043" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="648" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#3C4043">edit the file</text>

  <!-- modified -> staged (add again) -->
  <path d="M400,250 C380,220 390,205 410,192" fill="none" stroke="#3C4043" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="330" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#3C4043">git add</text>

  <text x="430" y="325" text-anchor="middle" font-size="12" font-style="italic" fill="#9AA0A6">A file loops between Committed and Modified for the rest of the project's life.</text>
</svg>
