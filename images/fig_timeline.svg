<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="parent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>

  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Each commit is a save point in time</text>

  <!-- track line -->
  <line x1="80" y1="150" x2="780" y2="150" stroke="#E0E0E0" stroke-width="3"/>

  <!-- nodes -->
  <!-- c1 -->
  <circle cx="140" cy="150" r="30" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2.5"/>
  <text x="140" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1A73E8">a82f31</text>
  <text x="140" y="162" text-anchor="middle" font-size="10" fill="#5F6368">oldest</text>
  <text x="140" y="205" text-anchor="middle" font-size="12" fill="#202124">"Create calculator"</text>

  <!-- c2 -->
  <circle cx="350" cy="150" r="30" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2.5"/>
  <text x="350" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#1A73E8">b72f10</text>
  <text x="350" y="205" text-anchor="middle" font-size="12" fill="#202124">"Add multiplication"</text>

  <!-- c3 -->
  <circle cx="560" cy="150" r="30" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2.5"/>
  <text x="560" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#1A73E8">c31a52</text>
  <text x="560" y="205" text-anchor="middle" font-size="12" fill="#202124">"Add division"</text>

  <!-- c4 HEAD -->
  <circle cx="770" cy="150" r="34" fill="#E6F4EA" stroke="#188038" stroke-width="3"/>
  <text x="770" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#188038">d90b4c</text>
  <text x="770" y="205" text-anchor="middle" font-size="12" fill="#202124">"Fix input error"</text>
  <rect x="720" y="86" width="100" height="26" rx="13" fill="#188038"/>
  <text x="770" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">HEAD (now)</text>
  <line x1="770" y1="112" x2="770" y2="118" stroke="#188038" stroke-width="2"/>

  <!-- parent arrows (child points back to parent) -->
  <line x1="318" y1="150" x2="172" y2="150" stroke="#5F6368" stroke-width="2" marker-end="url(#parent)"/>
  <line x1="528" y1="150" x2="382" y2="150" stroke="#5F6368" stroke-width="2" marker-end="url(#parent)"/>
  <line x1="734" y1="150" x2="592" y2="150" stroke="#5F6368" stroke-width="2" marker-end="url(#parent)"/>

  <text x="430" y="256" text-anchor="middle" font-size="13" font-style="italic" fill="#5F6368">Read left to right: oldest to newest. (git log shows the newest one first.)</text>
  <text x="430" y="278" text-anchor="middle" font-size="12" fill="#9AA0A6">Every commit remembers the one before it — that chain is your project's history.</text>
</svg>
