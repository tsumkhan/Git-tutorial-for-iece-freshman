<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="up" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#188038"/></marker>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A73E8"/></marker>
  </defs>

  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">What's next: one shared time machine (GitHub)</text>

  <!-- GitHub cloud box -->
  <rect x="285" y="66" width="290" height="96" rx="18" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.5"/>
  <!-- cloud icon (solid, no seams) -->
  <g fill="#5E35B1">
    <circle cx="352" cy="104" r="11"/>
    <circle cx="370" cy="97" r="15"/>
    <circle cx="389" cy="104" r="11"/>
    <rect x="341" y="104" width="58" height="12" rx="6"/>
  </g>
  <text x="470" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#5E35B1">GitHub</text>
  <text x="430" y="140" text-anchor="middle" font-size="12.5" fill="#5F6368">the shared copy everyone connects to, online</text>

  <!-- three local folders -->
  <g>
    <!-- Ali -->
    <g transform="translate(70,300)">
      <path d="M0,18 h44 l12,-16 h94 a10,10 0 0 1 10,10 v70 a10,10 0 0 1 -10,10 H10 a10,10 0 0 1 -10,-10 V28 a10,10 0 0 1 10,-10 z" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
    </g>
    <text x="150" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#1A73E8">Ali</text>
    <text x="150" y="372" text-anchor="middle" font-size="11.5" fill="#5F6368">his copy · full history</text>

    <!-- Sara -->
    <g transform="translate(350,300)">
      <path d="M0,18 h44 l12,-16 h94 a10,10 0 0 1 10,10 v70 a10,10 0 0 1 -10,10 H10 a10,10 0 0 1 -10,-10 V28 a10,10 0 0 1 10,-10 z" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
    </g>
    <text x="430" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#1A73E8">Sara</text>
    <text x="430" y="372" text-anchor="middle" font-size="11.5" fill="#5F6368">her copy · full history</text>

    <!-- Ahmed -->
    <g transform="translate(630,300)">
      <path d="M0,18 h44 l12,-16 h94 a10,10 0 0 1 10,10 v70 a10,10 0 0 1 -10,10 H10 a10,10 0 0 1 -10,-10 V28 a10,10 0 0 1 10,-10 z" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
    </g>
    <text x="710" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#1A73E8">Ahmed</text>
    <text x="710" y="372" text-anchor="middle" font-size="11.5" fill="#5F6368">his copy · full history</text>
  </g>

  <!-- sync arrows: push (green, up) and pull (blue, down), offset per person -->
  <!-- Ali -->
  <line x1="140" y1="300" x2="320" y2="166" stroke="#188038" stroke-width="2" marker-end="url(#up)"/>
  <line x1="162" y1="300" x2="342" y2="166" stroke="#1A73E8" stroke-width="2" marker-start="url(#dn)" stroke-dasharray="5 4"/>
  <!-- Sara -->
  <line x1="420" y1="300" x2="420" y2="166" stroke="#188038" stroke-width="2" marker-end="url(#up)"/>
  <line x1="442" y1="300" x2="442" y2="166" stroke="#1A73E8" stroke-width="2" marker-start="url(#dn)" stroke-dasharray="5 4"/>
  <!-- Ahmed -->
  <line x1="720" y1="300" x2="540" y2="166" stroke="#188038" stroke-width="2" marker-end="url(#up)"/>
  <line x1="698" y1="300" x2="518" y2="166" stroke="#1A73E8" stroke-width="2" marker-start="url(#dn)" stroke-dasharray="5 4"/>

  <!-- legend -->
  <line x1="250" y1="410" x2="285" y2="410" stroke="#188038" stroke-width="2.5" marker-end="url(#up)"/>
  <text x="292" y="415" font-size="13" fill="#202124"><tspan font-weight="700" fill="#188038">push</tspan> — send your commits up</text>
  <line x1="500" y1="410" x2="535" y2="410" stroke="#1A73E8" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#dn)"/>
  <text x="542" y="415" font-size="13" fill="#202124"><tspan font-weight="700" fill="#1A73E8">pull</tspan> — bring everyone's down</text>

  <text x="430" y="450" text-anchor="middle" font-size="13" font-style="italic" fill="#5F6368">No more emailing files around — one project, one shared history, everyone's work flows in.</text>
</svg>
