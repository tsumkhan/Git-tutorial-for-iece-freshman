<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Why commit messages matter</text>

  <!-- BAD -->
  <text x="215" y="76" text-anchor="middle" font-size="17" font-weight="700" fill="#D93025">✗  Useless</text>
  <g font-size="14">
    <rect x="70" y="92"  width="290" height="34" rx="7" fill="#FCE8E6" stroke="#EAA9A2"/><text x="88" y="114" fill="#202124">a1  "Changes"</text>
    <rect x="70" y="132" width="290" height="34" rx="7" fill="#FCE8E6" stroke="#EAA9A2"/><text x="88" y="154" fill="#202124">b2  "Changes"</text>
    <rect x="70" y="172" width="290" height="34" rx="7" fill="#FCE8E6" stroke="#EAA9A2"/><text x="88" y="194" fill="#202124">c3  "Changes"</text>
    <rect x="70" y="212" width="290" height="34" rx="7" fill="#FCE8E6" stroke="#EAA9A2"/><text x="88" y="234" fill="#202124">d4  "update"</text>
  </g>
  <text x="215" y="286" text-anchor="middle" font-size="13" fill="#5F6368">Which commit fixed the bug?</text>
  <text x="215" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#D93025">No idea.</text>

  <!-- divider -->
  <line x1="430" y1="86" x2="430" y2="320" stroke="#E0E0E0" stroke-width="2"/>

  <!-- GOOD -->
  <text x="645" y="76" text-anchor="middle" font-size="17" font-weight="700" fill="#188038">✓  Meaningful</text>
  <g font-size="13.5">
    <rect x="500" y="92"  width="300" height="34" rx="7" fill="#E6F4EA" stroke="#A8D5B5"/><text x="518" y="114" fill="#202124">a1  "Create calculator"</text>
    <rect x="500" y="132" width="300" height="34" rx="7" fill="#E6F4EA" stroke="#A8D5B5"/><text x="518" y="154" fill="#202124">b2  "Add multiplication"</text>
    <rect x="500" y="172" width="300" height="34" rx="7" fill="#E6F4EA" stroke="#A8D5B5"/><text x="518" y="194" fill="#202124">c3  "Fix division by zero"</text>
    <rect x="500" y="212" width="300" height="34" rx="7" fill="#E6F4EA" stroke="#A8D5B5"/><text x="518" y="234" fill="#202124">d4  "Add input validation"</text>
  </g>
  <text x="650" y="286" text-anchor="middle" font-size="13" fill="#5F6368">Which commit fixed the bug?</text>
  <text x="650" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#188038">c3 — you can read it at a glance.</text>
</svg>
