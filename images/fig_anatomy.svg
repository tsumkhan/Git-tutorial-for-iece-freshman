<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#1A73E8"/></marker>
  </defs>
  <text x="410" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">How to read one entry from git log</text>

  <!-- the log entry card -->
  <rect x="230" y="80" width="360" height="150" rx="10" fill="#1E1E1E" stroke="#3C4043" stroke-width="2"/>
  <g font-family="'Courier New',monospace" font-size="15">
    <text x="252" y="112" fill="#E8C468">commit a82f31c9b4...</text>
    <text x="252" y="140" fill="#D0D0D0">Author: Ali</text>
    <text x="252" y="168" fill="#D0D0D0">Date:   Mon Sep 15 10:00</text>
    <text x="272" y="204" fill="#81C995">Create calculator</text>
  </g>

  <!-- callouts -->
  <!-- ID -->
  <line x1="230" y1="107" x2="120" y2="95" stroke="#1A73E8" stroke-width="1.6"/>
  <rect x="10" y="74" width="118" height="40" rx="7" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="69" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1A73E8">unique ID</text>
  <text x="69" y="106" text-anchor="middle" font-size="10.5" fill="#5F6368">fingerprint of the commit</text>

  <!-- author -->
  <line x1="590" y1="135" x2="700" y2="120" stroke="#1A73E8" stroke-width="1.6"/>
  <rect x="694" y="102" width="116" height="36" rx="7" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="752" y="118" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1A73E8">who saved it</text>
  <text x="752" y="132" text-anchor="middle" font-size="10.5" fill="#5F6368">the author</text>

  <!-- date -->
  <line x1="590" y1="163" x2="700" y2="168" stroke="#1A73E8" stroke-width="1.6"/>
  <rect x="694" y="150" width="116" height="36" rx="7" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="752" y="166" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1A73E8">when</text>
  <text x="752" y="180" text-anchor="middle" font-size="10.5" fill="#5F6368">date &amp; time</text>

  <!-- message -->
  <line x1="272" y1="200" x2="120" y2="230" stroke="#188038" stroke-width="1.6"/>
  <rect x="10" y="216" width="150" height="40" rx="7" fill="#E6F4EA" stroke="#188038"/>
  <text x="85" y="232" text-anchor="middle" font-size="11.5" font-weight="700" fill="#188038">your message</text>
  <text x="85" y="248" text-anchor="middle" font-size="10.5" fill="#5F6368">what you changed</text>

  <text x="410" y="288" text-anchor="middle" font-size="13" fill="#5F6368">Tip: git log --oneline  shows just the ID + message, one per line.</text>
</svg>
