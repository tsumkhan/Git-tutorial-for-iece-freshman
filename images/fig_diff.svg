<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">git diff shows what changed since your last commit</text>

  <!-- terminal panel -->
  <rect x="120" y="70" width="520" height="150" rx="10" fill="#1E1E1E" stroke="#3C4043" stroke-width="2"/>
  <circle cx="142" cy="90" r="5" fill="#FF5F56"/><circle cx="160" cy="90" r="5" fill="#FFBD2E"/><circle cx="178" cy="90" r="5" fill="#27C93F"/>
  <text x="380" y="94" text-anchor="middle" font-size="12" fill="#9AA0A6">calculator.py</text>

  <g font-family="'Courier New',monospace" font-size="16">
    <!-- removed line -->
    <rect x="132" y="118" width="496" height="30" fill="#3A1A1A"/>
    <text x="146" y="138" fill="#F28B82">-  print("Hello")</text>
    <!-- added line -->
    <rect x="132" y="150" width="496" height="30" fill="#1A3320"/>
    <text x="146" y="170" fill="#81C995">+  print("Hello, Ali!")</text>
    <!-- unchanged context -->
    <text x="146" y="202" fill="#9AA0A6">   print("Done")</text>
  </g>

  <!-- legend -->
  <rect x="150" y="248" width="20" height="20" rx="4" fill="#3A1A1A" stroke="#F28B82"/>
  <text x="180" y="263" font-size="14" fill="#202124"><tspan font-family="'Courier New',monospace" font-weight="700" fill="#D93025">−</tspan>  a line was removed / changed</text>
  <rect x="430" y="248" width="20" height="20" rx="4" fill="#1A3320" stroke="#81C995"/>
  <text x="460" y="263" font-size="14" fill="#202124"><tspan font-family="'Courier New',monospace" font-weight="700" fill="#188038">+</tspan>  a line was added / changed</text>

  <text x="380" y="300" text-anchor="middle" font-size="13" font-style="italic" fill="#5F6368">This runs before you commit — it's your "what am I about to save?" check.</text>
</svg>
