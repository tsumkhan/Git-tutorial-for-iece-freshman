  <text x="180" y="396" text-anchor="middle" font-size="13" fill="#5F6368">What changed? Can I go back?</text>

  <!-- arrow -->
  <line x1="330" y1="220" x2="400" y2="220" stroke="#188038" stroke-width="3" marker-end="url(#ar)"/>
  <text x="365" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#188038">Git</text>

  <!-- RIGHT: order -->
  <text x="650" y="74" text-anchor="middle" font-size="17" font-weight="700" fill="#188038">With Git</text>
  <rect x="560" y="92" width="180" height="34" rx="8" fill="#ffffff" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="650" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Science_Project.docx</text>
  <text x="650" y="146" text-anchor="middle" font-size="12" fill="#5F6368">one file  ·  full history kept for you</text>

