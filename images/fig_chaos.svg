    <rect x="78" y="128" width="205" height="30" rx="6" fill="#FCE8E6" stroke="#EAA9A2"/><text x="92" y="148">Science_Project_Final.docx</text>
    <rect x="60" y="164" width="205" height="30" rx="6" fill="#FCE8E6" stroke="#EAA9A2"/><text x="74" y="184">Science_Project_Final2.docx</text>
    <rect x="86" y="200" width="215" height="30" rx="6" fill="#FCE8E6" stroke="#EAA9A2"/><text x="100" y="220">Science_Project_Final_Updated.docx</text>
    <rect x="60" y="236" width="205" height="30" rx="6" fill="#FCE8E6" stroke="#EAA9A2"/><text x="74" y="256">Science_Project_Ali.docx</text>
