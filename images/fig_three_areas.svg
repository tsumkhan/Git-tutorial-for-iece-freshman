<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3C4043"/>
    </marker>
    <marker id="arrowback" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9AA0A6"/>
    </marker>
  </defs>

  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">The three places your file can live</text>

  <!-- Working Directory -->
  <rect x="30" y="90" width="230" height="150" rx="14" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2.5"/>
  <text x="145" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#1A73E8">Working Directory</text>
  <text x="145" y="144" text-anchor="middle" font-size="13" fill="#5F6368">the files you actually edit</text>
  <rect x="70" y="160" width="150" height="52" rx="8" fill="#ffffff" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="145" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">calculator.py</text>
  <text x="145" y="202" text-anchor="middle" font-size="11" fill="#D93025">(edited, not saved)</text>

  <!-- Staging Area -->
  <rect x="315" y="90" width="230" height="150" rx="14" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2.5"/>
  <text x="430" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#B06000">Staging Area</text>
  <text x="430" y="144" text-anchor="middle" font-size="13" fill="#5F6368">the box you are packing</text>
  <rect x="355" y="160" width="150" height="52" rx="8" fill="#ffffff" stroke="#F9AB00" stroke-width="1.5"/>
  <text x="430" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">calculator.py</text>
  <text x="430" y="202" text-anchor="middle" font-size="11" fill="#B06000">(ready to save)</text>

  <!-- Repository -->
  <rect x="600" y="90" width="230" height="150" rx="14" fill="#E6F4EA" stroke="#188038" stroke-width="2.5"/>
  <text x="715" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#188038">Repository (.git)</text>
  <text x="715" y="144" text-anchor="middle" font-size="13" fill="#5F6368">your saved history</text>
  <circle cx="662" cy="188" r="16" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <circle cx="704" cy="188" r="16" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <circle cx="746" cy="188" r="16" fill="#188038" stroke="#188038" stroke-width="1.5"/>
  <text x="788" y="192" font-size="11" fill="#188038">commits</text>

  <!-- add arrow -->
  <line x1="262" y1="150" x2="313" y2="150" stroke="#3C4043" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="288" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#3C4043">git add</text>

  <!-- commit arrow -->
  <line x1="547" y1="150" x2="598" y2="150" stroke="#3C4043" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="572" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#3C4043">git commit</text>

  <!-- go back arrow -->
  <path d="M700,258 C560,300 300,300 150,258" fill="none" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowback)"/>
  <text x="430" y="312" text-anchor="middle" font-size="13" font-style="italic" fill="#5F6368">git restore / git checkout  —  travel back to a saved version</text>
</svg>
