<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3C4043"/></marker>
  </defs>
  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">git init turns a normal folder into a repository</text>

  <!-- normal folder -->
  <path d="M90,120 h60 l14,-18 h96 a10,10 0 0 1 10,10 v96 a10,10 0 0 1 -10,10 h-160 a10,10 0 0 1 -10,-10 v-88 a10,10 0 0 1 10,-10 z" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="2"/>
  <text x="180" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#3C4043">MyCalculator/</text>
  <text x="180" y="202" text-anchor="middle" font-size="12" fill="#5F6368">calculator.py</text>
  <text x="180" y="258" text-anchor="middle" font-size="13" fill="#5F6368">just a folder</text>

  <!-- arrow -->
  <line x1="330" y1="170" x2="410" y2="170" stroke="#3C4043" stroke-width="3" marker-end="url(#ar2)"/>
  <rect x="332" y="140" width="76" height="24" rx="12" fill="#202124"/>
  <text x="370" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">git init</text>

  <!-- git repo folder -->
  <path d="M470,120 h60 l14,-18 h190 a10,10 0 0 1 10,10 v96 a10,10 0 0 1 -10,10 h-254 a10,10 0 0 1 -10,-10 v-88 a10,10 0 0 1 10,-10 z" fill="#E6F4EA" stroke="#188038" stroke-width="2.5"/>
  <text x="600" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#188038">MyCalculator/  (Git repository)</text>
  <text x="600" y="198" text-anchor="middle" font-size="12" fill="#202124">calculator.py</text>
  <rect x="510" y="210" width="180" height="26" rx="6" fill="#ffffff" stroke="#9AA0A6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="600" y="228" text-anchor="middle" font-size="12" fill="#5F6368">.git  (hidden — don't touch)</text>
  <text x="600" y="270" text-anchor="middle" font-size="13" fill="#188038">Git now tracks everything inside</text>
</svg>
